[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nasa-power"
version = "0.1.0"
description = "Python client and CLI for querying regional data from the NASA POWER API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "matplotlib>=3.9.0",
    "openai>=3.51.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.12",
    "requests>=2.32.0",
    "uvicorn>=0.32.0",
    "websockets>=17.4",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[project.scripts]
nasa-power = "nasa_power.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nasa_power"]

[tool.pytest.ini_options]
testpaths = ["tests"]
