<!DOCTYPE html><html class="dark" lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100%;min-height:100%;margin:0;padding:0;background-color:#131316;color:#e4e1e6;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}.pl-safe{padding-left:env(safe-area-inset-left,0px);}.pr-safe{padding-right:env(safe-area-inset-right,0px);}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{colors:{"tertiary":"#ffffff","on-secondary-container":"#bcbbc5","tertiary-fixed-dim":"#c6c6cf","tertiary-fixed":"#e2e1eb","on-primary-fixed":"#1a1c1d","outline-variant":"#444749","secondary-fixed":"#e3e1ec","secondary":"#c6c5cf","on-primary":"#2f3132","on-tertiary":"#2f3037","surface":"#131316","on-secondary":"#2f3038","primary-fixed-dim":"#c6c6c7","inverse-primary":"#5d5e60","secondary-container":"#4a4b53","surface-variant":"#353438","surface-container-high":"#2a2a2d","on-surface":"#e4e1e6","inverse-surface":"#e4e1e6","on-primary-container":"#636466","on-secondary-fixed":"#1a1b22","on-error":"#690005","on-background":"#e4e1e6","on-tert </head><body class="bg-surface font-body-md text-on-surface antialiased flex flex-col min-h-screen selection:bg-surface-variant selection:text-primary"><main class="flex-1 flex flex-col relative w-full bg-surface pt-safe pb-safe pl-safe pr-safe"><div class="flex flex-col w-full relative overflow-hidden select-none min-h-screen">
<!-- Full-Bleed YouTube Cinematic Video Grounding -->
<div class="absolute inset-0 w-full h-full overflow-hidden pointer-events-none z-0">
<div class="video-background-wrapper">
<iframe allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen="" class="w-full h-full pointer-events-none border-0" id="ytVideoIframe" src="https://www.youtube-nocookie.com/embed/85kTHwJ1Ju8?autoplay=1&amp;mute=1&amp;controls=0&amp;loop=1&amp;playlist=85kTHwJ1Ju8&amp;playsinline=1&amp;enablejsapi=1&amp;rel=0&amp;showinfo=0"></iframe>
</div>
<!-- Dynamic Obsidian Ethereal Darkening Veil -->
<div class="absolute inset-0 transition-all duration-1000 ease-out" id="videoVeil" style="background: linear-gradient(rgba(19, 19, 22, 0.12) 0%, rgba(19, 19, 22, 0.05) 50%, rgba(19, 19, 22, 0.18) 100%); backdrop-filter: blur(0px);"></div>
<!-- Static Vignette Shadow Gradient for Depth & Readability -->
<div class="absolute inset-0 pointer-events-none" style="background: linear-gradient(rgba(19, 19, 22, 0.15) 0%, transparent 35%, transparent 75%, rgba(19, 19, 22, 0.25) 100%);"></div>
<div class="absolute top-0 left-0 right-0 w-full h-36 pointer-events-none z-20" style="background: linear-gradient(rgba(19, 19, 22, 0.75) 0%, rgba(19, 19, 22, 0.35) 45%, rgba(19, 19, 22, 0) 100%);"></div></div>
<!-- Top Controls & Status Bar -->
<aside aria-label="System status &amp; controls" class="relative z-30 w-full flex items-center justify-between px-margin pt-4 pb-2">

</aside>
<!-- Content Flow Container -->
<div class="relative z-20 w-full max-w-[440px] mx-auto min-h-[740px] flex-1 flex flex-col justify-between px-margin py-6">
<!-- Clean Circular Loading Percentage HUD Screen -->

<!-- Brand Title + Modern Ultra-Transparent Liquid Glass Login Surface -->
<div class="w-full flex-1 flex flex-col transition-all duration-700 opacity-100 translate-y-0 justify-between gap-6" id="mainEntranceGroup">
<!-- Brand Emblem & Headline -->
<header class="w-full flex flex-col items-center text-center pt-16 md:pt-20 pb-4 transition-all duration-700 opacity-100 translate-y-0" id="brandTitleBlock">
<h1 class="text-primary flex items-center justify-center font-bold tracking-tight" style="font-family: &quot;Space Grotesk&quot;, sans-serif; font-size: 3rem; line-height: 1.15; letter-spacing: -0.03em; text-shadow: rgba(0, 0, 0, 0.85) 0px 4px 24px, rgba(0, 0, 0, 0.9) 0px 2px 6px;"><span>PetaniPal</span></h1>
</header>
<!-- Ultra-transparent Liquid Glass Login Surface -->
<section aria-label="Account Login" class="w-full backdrop-blur-xl rounded-xl p-5 shadow-2xl transition-all duration-700 flex flex-col gap-4 border border-outline-variant/20 opacity-100 translate-y-0" id="loginCardBlock" style="background: linear-gradient(135deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.02) 100%); backdrop-filter: blur(16px) saturate(200%); border: 1px solid rgba(255, 255, 255, 0.25); box-shadow: rgba(0, 0, 0, 0.3) 0px 20px 50px, rgba(255, 255, 255, 0.3) 0px 1px 1px 0px inset;">
<!-- Credentials Form -->
<form class="flex flex-col gap-3.5" id="farmLoginForm" onsubmit="event.preventDefault();" style="text-shadow: rgba(0, 0, 0, 0.85) 0px 1px 3px;">
<!-- Email Input -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant flex items-center justify-between" for="operatorId">
<span>Email</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-lg pointer-events-none">badge</span>
<input autocomplete="username" class="w-full pl-10 pr-3.5 py-3 rounded-lg text-on-surface font-body-md text-body-md placeholder:text-outline focus:outline-none focus:bg-surface-container-high transition-colors border border-outline-variant/30 focus:border-outline" id="operatorId" placeholder="pilot.jensen@farmpal.com" style="background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.18); box-shadow: rgba(0, 0, 0, 0.3) 0px 2px 4px inset; color: rgb(255, 255, 255); text-shadow: rgba(0, 0, 0, 0.7) 0px 1px 2px;" type="text" value="pilot.jensen@farmpal.com">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="operatorKey">Password</label>
<button class="font-label-sm text-label-sm text-secondary hover:text-primary transition-colors cursor-pointer" type="button">
Forgot password?
</button>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-lg pointer-events-none">lock</span>
<input autocomplete="current-password" class="w-full pl-10 pr-10 py-3 rounded-lg text-on-surface font-body-md text-body-md placeholder:text-outline focus:outline-none focus:bg-surface-container-high transition-colors border border-outline-variant/30 focus:border-outline" id="operatorKey" placeholder="Enter password" style="background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.18); box-shadow: rgba(0, 0, 0, 0.3) 0px 2px 4px inset; color: rgb(255, 255, 255); text-shadow: rgba(0, 0, 0, 0.7) 0px 1px 2px;" type="password" value="••••••••••••">
<button class="absolute right-3 text-on-surface-variant hover:text-primary transition-colors cursor-pointer" id="btnTogglePassword" title="Toggle visibility" type="button">
<span class="material-symbols-outlined text-lg">visibility</span>
</button>
</div>
</div>
<!-- Remember checkbox -->
<div class="flex items-center justify-between pt-0.5">
<label class="flex items-center gap-2 cursor-pointer select-none">
<input checked="" class="w-4 h-4 rounded bg-surface-container text-primary accent-primary cursor-pointer border-outline-variant" type="checkbox">
<span class="font-label-sm text-label-sm text-on-surface-variant">Remember Password</span>
</label>
</div>
<!-- Main Luminescent Sign In Button -->
<button class="w-full mt-2 py-3.5 px-4 rounded-full bg-primary text-on-primary font-label-lg text-label-lg font-semibold flex items-center justify-center gap-2 shadow-lg hover:bg-primary-container hover:text-on-primary-container active:scale-[0.98] transition-all cursor-pointer" id="btnSignIn" style="background: linear-gradient(rgb(255, 255, 255) 0%, rgb(236, 236, 236) 100%); color: rgb(19, 19, 22); box-shadow: rgba(255, 255, 255, 0.35) 0px 8px 24px -4px, rgba(0, 0, 0, 0.3) 0px 2px 6px, rgb(255, 255, 255) 0px 1px 1px inset;" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</form>
<!-- Secondary Access Methods -->
<div class="flex justify-center w-full mt-1">
<button class="py-2.5 px-5 rounded-lg text-on-surface font-label-sm text-label-sm flex items-center justify-center gap-1.5 transition-colors active:scale-95 cursor-pointer shadow-sm" style="background: rgba(255, 255, 255, 0.06); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: rgba(0, 0, 0, 0.25) 0px 4px 16px; text-shadow: rgba(0, 0, 0, 0.8) 0px 1px 3px;" type="button">
<span class="material-symbols-outlined text-base">fingerprint</span>
<span>Biometric ID</span>
</button>
</div>
</section>
<!-- Atmospheric Status Footer -->
<footer class="w-full text-center pt-4 pb-2"></footer>
</div>
</div>
</div>
<script>
  (function () {
    const videoVeil = document.getElementById("videoVeil");
    const hudPhase = document.getElementById("hudPhase");
    const mainEntranceGroup = document.getElementById("mainEntranceGroup");
    const brandTitleBlock = document.getElementById("brandTitleBlock");
    const loginCardBlock = document.getElementById("loginCardBlock");
    const hudProgressCircle = document.getElementById("hudProgressCircle");
    const hudPercentageText = document.getElementById("hudPercentageText");
    const btnReplayReel = document.getElementById("btnReplayReel");
    const btnTogglePassword = document.getElementById("btnTogglePassword");
    const operatorKey = document.getElementById("operatorKey");
    const btnSignIn = document.getElementById("btnSignIn");

    let animationFrameId = null;
    let sequenceTimeouts = [];

    function clearTimers() {
      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }
      sequenceTimeouts.forEach(clearTimeout);
      sequenceTimeouts = [];
    }

    function runSequence() {
      clearTimers();

      // Reset DOM state for Phase 1: Video visible clearly, HUD active
      videoVeil.style.background = "linear-gradient(rgba(19, 19, 22, 0.12) 0%, rgba(19, 19, 22, 0.05) 50%, rgba(19, 19, 22, 0.18) 100%)";
      videoVeil.style.backdropFilter = "blur(0px)";

      hudPhase.style.display = "flex";
      requestAnimationFrame(function () {
        hudPhase.classList.remove("opacity-0", "pointer-events-none", "-translate-y-4");
        hudPhase.classList.add("opacity-100", "translate-y-0");
      });

      mainEntranceGroup.classList.add("hidden");
      mainEntranceGroup.classList.remove("opacity-100", "translate-y-0");
      mainEntranceGroup.classList.add("opacity-0", "translate-y-4");

      brandTitleBlock.classList.remove("opacity-100", "translate-y-0");
      brandTitleBlock.classList.add("opacity-0", "translate-y-3");

      loginCardBlock.classList.remove("opacity-100", "translate-y-0");
      loginCardBlock.classList.add("opacity-0", "translate-y-4");

      const circumference = 2 * Math.PI * 50; // 314.159
      hudProgressCircle.style.strokeDasharray = circumference;
      hudProgressCircle.style.strokeDashoffset = circumference;
      hudPercentageText.textContent = "0%";

      const duration = 2800; // ~2.8 seconds smooth animation
      let startTime = null;

      function stepProgress(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const percent = Math.floor(progress * 100);

        // Smoothly update circle ring offset
        const currentOffset = circumference - (progress * circumference);
        hudProgressCircle.style.strokeDashoffset = currentOffset;

        // Actively increment percentage text: 0%, 1%, 2%, ... 100%
        hudPercentageText.textContent = percent + "%";

        if (progress < 1) {
          animationFrameId = requestAnimationFrame(stepProgress);
        } else {
          // Finished counting to 100%
          hudProgressCircle.style.strokeDashoffset = 0;
          hudPercentageText.textContent = "100%";

          // After reaching 100%, smoothly transition to the login screen
          sequenceTimeouts.push(
            setTimeout(function () {
              // Fade out HUD
              hudPhase.classList.remove("opacity-100", "translate-y-0");
              hudPhase.classList.add("opacity-0", "pointer-events-none", "-translate-y-4");

              sequenceTimeouts.push(
                setTimeout(function () {
                  hudPhase.style.display = "none";
                  mainEntranceGroup.classList.remove("hidden");

                  requestAnimationFrame(function () {
                    mainEntranceGroup.classList.remove("opacity-0", "translate-y-4");
                    mainEntranceGroup.classList.add("opacity-100", "translate-y-0");

                    // Title glides in
                    brandTitleBlock.classList.remove("opacity-0", "translate-y-3");
                    brandTitleBlock.classList.add("opacity-100", "translate-y-0");

                    // Login card rises smoothly
                    setTimeout(function () {
                      loginCardBlock.classList.remove("opacity-0", "translate-y-4");
                      loginCardBlock.classList.add("opacity-100", "translate-y-0");
                    }, 250);
                  });
                }, 350)
              );
            }, 300)
          );
        }
      }

      animationFrameId = requestAnimationFrame(stepProgress);
    }

    // Replay reel trigger
    btnReplayReel.addEventListener("click", function () {
      btnReplayReel.classList.add("scale-95");
      setTimeout(function () {
        btnReplayReel.classList.remove("scale-95");
      }, 150);
      runSequence();
    });

    // Password visibility toggle
    if (btnTogglePassword && operatorKey) {
      btnTogglePassword.addEventListener("click", function () {
        const isPassword = operatorKey.type === "password";
        operatorKey.type = isPassword ? "text" : "password";
        btnTogglePassword.querySelector(".material-symbols-outlined").textContent = isPassword
          ? "visibility_off"
          : "visibility";
      });
    }

    // Tactile sign-in microinteraction
    if (btnSignIn) {
      btnSignIn.addEventListener("click", function () {
        const originalText = btnSignIn.innerHTML;
        btnSignIn.disabled = true;
        btnSignIn.innerHTML = `
          <span class="material-symbols-outlined animate-spin text-lg">progress_activity</span>
          <span>Accessing Farm Fleet...</span>
        `;
        setTimeout(function () {
          btnSignIn.innerHTML = `
            <span class="material-symbols-outlined text-lg">check</span>
            <span>Welcome, Pilot Jensen</span>
          `;
          setTimeout(function () {
            btnSignIn.disabled = false;
            btnSignIn.innerHTML = originalText;
          }, 1800);
        }, 1100);
      });
    }

    // Initialize loading counter sequence immediately on mount
    runSequence();
  })();
</script></main>






</body></html>
