      transform: scale(0.97);
    }

    .clay-nav-active {
      background: linear-gradient(145deg, #235d4d, #174538);
      box-shadow: 
        5px 6px 14px rgba(27, 77, 62, 0.32),

      background: #d4ebd8;
      box-shadow: 
        inset 6px 8px 16px rgba(138, 189, 169, 0.4),

        6px 8px 20px rgba(50, 48, 46, 0.06);

    }

    .clay-halo.active-pulse {
      background: #c3e9cb;
      box-shadow: 
        0 0 0 10px rgba(117, 218, 168, 0.28),
        0 0 24px rgba(52, 211, 153, 0.4),
        inset 6px 8px 16px rgba(138, 189, 169, 0.5),
        inset -6px -6px 14px rgba(255, 255, 255, 0.9);
      animation: pulseAura 1.4s infinite ease-in-out;
    }

    @keyframes pulseAura {
      0%, 100% {
        box-shadow: 
          0 0 0 8px rgba(117, 218, 168, 0.25),
          0 0 20px rgba(52, 211, 153, 0.35),
          inset 6px 8px 16px rgba(138, 189, 169, 0.5),
          inset -6px -6px 14px rgba(255, 255, 255, 0.9);

          0 0 0 16px rgba(117, 218, 168, 0.45),
          0 0 32px rgba(52, 211, 153, 0.6),
          inset 6px 8px 16px rgba(138, 189, 169, 0.5),
          inset -6px -6px 14px rgba(255, 255, 255, 0.9);
      }
    }

    .clay-circle-btn {

        inset -2px -2px 4px rgba(180, 168, 158, 0.2);

    .earth-globe {
      background: radial-gradient(circle at 30% 25%, #2574a9 0%, #175482 32%, #0e375c 68%, #09243d 100%);

        10px 16px 30px rgba(9, 36, 61, 0.46),

        inset 4px 4px 12px rgba(255, 255, 255, 0.45),

      transition: transform 0.2s ease, box-shadow 0.2s ease;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .earth-globe.is-pressing {
      transform: scale(0.96);
      box-shadow: 
        6px 8px 18px rgba(9, 36, 61, 0.42),
        inset 6px 6px 14px rgba(0, 0, 0, 0.45),
        inset -3px -3px 8px rgba(255, 255, 255, 0.35);
    }

    /* Spinning earth horizontal translation layers */
    .earth-spin-layer {
      width: 200%;
      height: 100%;
      display: flex;
      will-change: transform;
      animation: spinEarth 10s linear infinite;
      animation-play-state: paused;
    }

    .earth-clouds-layer {
      width: 200%;
      height: 100%;
      display: flex;
      will-change: transform;
      animation: spinEarth 7s linear infinite;
      animation-play-state: paused;
    }

    @keyframes spinEarth {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-50%);
      }
    }

    .wave-bar {
      width: 3px;
      height: 8px;
      background-color: #ffffff;
      border-radius: 9999px;
      margin: 0 1.5px;

    .wave-bar:nth-child(5) { animation-delay: 0.4s; height: 8px; }

    @keyframes waveDance {
      0% {
        transform: scaleY(0.4);
      }
      100% {

<!-- Anchored Privacy Helper Text -->

</footer>
</main>
<script>
    // Lightweight tactile feedback for general buttons
    document.querySelectorAll('button:not(#earthVoiceBtn)').forEach(btn => {
      btn.addEventListener('click', () => {
        btn.classList.add('opacity-90');
        setTimeout(() => btn.classList.remove('opacity-90'), 150);
      });
    });

    // Interactive Earth Voice Button: Continuous horizontal spin & Listening feedback while held
    const earthBtn = document.getElementById('earthVoiceBtn');
    const spinLand = document.getElementById('spinLand');
    const spinClouds = document.getElementById('spinClouds');
    const haloContainer = document.getElementById('haloContainer');
    const voiceBtnLabel = document.getElementById('voiceBtnLabel');
    const voiceWaveIndicator = document.getElementById('voiceWaveIndicator');

    let isListening = false;

    function startListening(e) {
      if (e) {
        // Prevent default mobile context menu / text selection
        if (e.cancelable && e.type === 'touchstart') e.preventDefault();
      }
      if (isListening) return;
      isListening = true;

      // Start earth horizontal rotation
      spinLand.style.animationPlayState = 'running';
      spinClouds.style.animationPlayState = 'running';

      // Visual state updates
      earthBtn.classList.add('is-pressing');
      haloContainer.classList.add('active-pulse');
      voiceWaveIndicator.classList.remove('hidden');
      voiceWaveIndicator.classList.add('flex');
      voiceBtnLabel.textContent = 'Listening...';
      voiceBtnLabel.classList.add('text-emerald-200');
    }

    function stopListening() {
      if (!isListening) return;
      isListening = false;

      // Pause earth horizontal rotation (maintains continuous position or pauses gracefully)
      spinLand.style.animationPlayState = 'paused';
      spinClouds.style.animationPlayState = 'paused';

      // Reset visual state
      earthBtn.classList.remove('is-pressing');
      haloContainer.classList.remove('active-pulse');
      voiceWaveIndicator.classList.add('hidden');
      voiceWaveIndicator.classList.remove('flex');
      voiceBtnLabel.textContent = 'Hold to speak';
      voiceBtnLabel.classList.remove('text-emerald-200');
    }

    // Pointer & touch events for ergonomic multi-device support
    earthBtn.addEventListener('pointerdown', startListening);
    window.addEventListener('pointerup', stopListening);
    window.addEventListener('pointercancel', stopListening);
    earthBtn.addEventListener('contextmenu', (e) => e.preventDefault());

    // Keyboard support (Spacebar / Enter to hold)
    earthBtn.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        startListening();
      }
    });
    earthBtn.addEventListener('keyup', (e) => {
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        stopListening();
      }
    });
  </script>
